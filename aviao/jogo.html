<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyDash — Menu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--gold:#FFD700;--accent:#00d4ff;--sky:#0a1628;--white:#e0f0ff;}
        body{overflow:hidden;background:var(--sky);font-family:'Exo 2',sans-serif;cursor:default;}
        #bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;}
        #horizon{position:fixed;bottom:0;left:0;width:100%;height:35%;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(34,80,34,0.8) 0%,rgba(34,100,34,0.4) 30%,transparent 100%);}
        #menu{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;}
        #logo{font-family:'Orbitron',monospace;font-size:clamp(55px,9vw,110px);font-weight:900;color:var(--white);letter-spacing:8px;text-shadow:0 0 20px rgba(0,212,255,0.8),0 0 60px rgba(0,212,255,0.4),0 4px 0 rgba(0,0,0,0.5);animation:logoFloat 4s ease-in-out infinite;line-height:1;margin-bottom:4px;}
        #logo span{color:var(--gold);text-shadow:0 0 30px rgba(255,215,0,0.8),0 4px 0 rgba(0,0,0,0.5);}
        @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-12px) rotate(1deg);}}
        #tagline{font-size:clamp(11px,1.8vw,16px);font-weight:300;color:rgba(255,255,255,0.55);letter-spacing:6px;text-transform:uppercase;margin-bottom:36px;}
        #coins-display{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(255,215,0,0.12),rgba(255,165,0,0.08));border:1px solid rgba(255,215,0,0.35);border-radius:40px;padding:10px 24px;margin-bottom:36px;backdrop-filter:blur(10px);}
        .coin-icon{width:26px;height:26px;background:radial-gradient(circle at 35% 35%,#FFE87C,#FFD700,#B8860B);border-radius:50%;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 0 10px rgba(255,215,0,0.5);animation:coinSpin 3s linear infinite;}
        @keyframes coinSpin{0%,100%{transform:rotateY(0) scale(1);}50%{transform:rotateY(180deg) scale(1.1);}}
        #menu-coins{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--gold);text-shadow:0 0 10px rgba(255,215,0,0.5);}
        .coin-label{font-size:11px;color:rgba(255,215,0,0.7);letter-spacing:2px;text-transform:uppercase;}

        /* Mode selector */
        #mode-selector{display:flex;gap:14px;margin-bottom:20px;}
        .mode-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:18px 24px;cursor:pointer;transition:all 0.3s;width:160px;text-align:center;}
        .mode-card:hover,.mode-card.selected{background:rgba(0,212,255,0.08);border-color:var(--accent);transform:translateY(-3px);}
        .mode-card.selected{box-shadow:0 0 20px rgba(0,212,255,0.2);}
        .mode-icon{font-size:28px;margin-bottom:8px;}
        .mode-name{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;color:var(--white);margin-bottom:4px;}
        .mode-desc{font-size:10px;color:rgba(255,255,255,0.4);}

        /* Buttons */
        .btn-group{display:flex;flex-direction:column;gap:12px;align-items:center;}
        .menu-btn{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;letter-spacing:4px;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;padding:16px 55px;position:relative;overflow:hidden;transition:all 0.3s;width:270px;}
        .menu-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent);transition:left 0.4s;}
        .menu-btn:hover::before{left:100%;}
        #btn-play{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#fff;box-shadow:0 4px 25px rgba(0,212,255,0.5),0 2px 0 #004466;font-size:20px;padding:20px 65px;}
        #btn-play:hover{transform:translateY(-3px);box-shadow:0 8px 35px rgba(0,212,255,0.7);}
        .pulse-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;border-radius:8px;border:2px solid rgba(0,212,255,0.6);animation:pulseRing 2s ease-out infinite;pointer-events:none;}
        @keyframes pulseRing{0%{transform:translate(-50%,-50%) scale(1);opacity:0.8;}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0;}}
        #btn-hangar{background:linear-gradient(135deg,rgba(255,215,0,0.12),rgba(255,165,0,0.08));color:var(--gold);border:1px solid rgba(255,215,0,0.45);box-shadow:0 4px 20px rgba(255,215,0,0.15);backdrop-filter:blur(5px);}
        #btn-hangar:hover{transform:translateY(-3px);background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(255,165,0,0.15));box-shadow:0 8px 30px rgba(255,215,0,0.35);}

        /* Bottom row */
        #bottom-row{display:flex;gap:12px;margin-top:8px;}
        .mini-btn{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;padding:10px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.55);border-radius:6px;cursor:pointer;transition:all 0.2s;width:129px;}
        .mini-btn:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.85);border-color:rgba(255,255,255,0.25);}

        /* Best score */
        #best-score{display:flex;align-items:center;gap:8px;margin-bottom:14px;opacity:0.65;}
        #best-score span{font-family:'Orbitron',monospace;font-size:12px;color:rgba(255,255,255,0.65);letter-spacing:2px;}
        #best-score strong{color:var(--gold);font-size:15px;}

        #version{position:fixed;bottom:18px;right:20px;font-family:'Orbitron',monospace;font-size:10px;color:rgba(255,255,255,0.18);letter-spacing:2px;z-index:10;}
        #controls-hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,0.28);letter-spacing:2px;z-index:10;}
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="horizon"></div>
    <div id="menu">
        <div id="logo">SKY<span>DASH</span></div>
        <div id="tagline">Paper Plane Adventure</div>
        <div id="coins-display">
            <div class="coin-icon">✦</div>
            <span id="menu-coins">0</span>
            <span class="coin-label">Moedas</span>
        </div>
        <div id="best-score">
            <span>RECORDE:</span>
            <strong id="best-score-val">0</strong>
            <span>PTS</span>
        </div>

        <!-- Mode selector -->
        <div id="mode-selector">
            <div class="mode-card selected" id="card-free" onclick="selectMode('free')">
                <div class="mode-icon">🕊</div>
                <div class="mode-name">MODO LIVRE</div>
                <div class="mode-desc">Voar sem limite</div>
            </div>
            <div class="mode-card" id="card-career" onclick="selectMode('career')">
                <div class="mode-icon">🎯</div>
                <div class="mode-name">CARREIRA</div>
                <div class="mode-desc">1000 missões</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="menu-btn" id="btn-play">
                <div class="pulse-ring"></div>
                ▶ JOGAR
            </button>
            <button class="menu-btn" id="btn-hangar" onclick="location.href='hangar.html'">✈ HANGAR</button>
            <div id="bottom-row">
                <button class="mini-btn" onclick="location.href='career.html'">📋 MISSÕES</button>
                <button class="mini-btn" onclick="location.href='profile.html'">👤 PERFIL</button>
            </div>
        </div>
    </div>
    <div id="version">v3.0 · MULTIPLAYER</div>
    <div id="controls-hint">✦ MOVA O MOUSE PARA PILOTAR ✦</div>

    <script>
        let selectedMode = 'free';
        function selectMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
            document.getElementById('card-'+mode).classList.add('selected');
        }
        document.getElementById('btn-play').onclick = () => {
            if (selectedMode === 'career') {
                location.href = 'career.html';
            } else {
                location.href = 'game.html?mode=free';
            }
        };

        const coins = parseInt(localStorage.getItem('skydash_coins') || '0');
        const best  = parseInt(localStorage.getItem('skydash_best')  || '0');
        document.getElementById('menu-coins').textContent   = coins.toLocaleString('pt-BR');
        document.getElementById('best-score-val').textContent = best.toLocaleString('pt-BR');

        // Three.js animated background (same as before)
        const canvas = document.getElementById('bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1628);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
        camera.position.set(0,80,200); camera.lookAt(0,50,0);
        scene.add(new THREE.AmbientLight(0x334466,1));
        const moon=new THREE.DirectionalLight(0x88aaff,0.8); moon.position.set(-100,200,50); scene.add(moon);
        const starGeo=new THREE.BufferGeometry();
        const sp=new Float32Array(2000*3);
        for(let i=0;i<2000;i++){sp[i*3]=(Math.random()-0.5)*2000;sp[i*3+1]=Math.random()*800;sp[i*3+2]=(Math.random()-0.5)*2000;}
        starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
        scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:1.2,transparent:true,opacity:0.8})));
        // Ground
        scene.add(Object.assign(new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:0x1a3d1a})),{rotation:{x:-Math.PI/2,y:0,z:0}}));
        // Mountains silhouette
        for(let i=0;i<8;i++){const h=50+Math.random()*100;const m=new THREE.Mesh(new THREE.ConeGeometry(40+Math.random()*40,h,5),new THREE.MeshStandardMaterial({color:0x111a2a,flatShading:true}));m.position.set((Math.random()-0.5)*600,h/2,-200-Math.random()*200);scene.add(m);}
        // Demo plane
        const pGeo=new THREE.BufferGeometry();
        const pv=new Float32Array([0,0,-2.5,-1.5,0.2,1.5,0,-0.5,1.5,0,0,-2.5,0,-0.5,1.5,1.5,0.2,1.5,0,0,-1.8,0,-0.5,1.5,0,0.8,1.5]);
        pGeo.setAttribute('position',new THREE.BufferAttribute(pv,3)); pGeo.computeVertexNormals();
        const savedColor=localStorage.getItem('skydash_color')||'#ffffff';
        const demoPlane=new THREE.Mesh(pGeo,new THREE.MeshStandardMaterial({color:new THREE.Color(savedColor),side:THREE.DoubleSide,roughness:0.4}));
        demoPlane.scale.setScalar(6); demoPlane.position.set(0,80,0); scene.add(demoPlane);
        // Clouds
        const cMat=new THREE.MeshStandardMaterial({color:0x334466,transparent:true,opacity:0.5,flatShading:true});
        for(let i=0;i<15;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const c=new THREE.Mesh(new THREE.SphereGeometry(5,5,5),cMat);c.position.set(Math.random()*12-6,Math.random()*4,Math.random()*8-4);const s=0.6+Math.random()*0.8;c.scale.set(s,s*0.6,s);g.add(c);}g.position.set((Math.random()-0.5)*400,80+Math.random()*60,(Math.random()-0.5)*400);scene.add(g);}
        const clock=new THREE.Clock();
        function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();demoPlane.rotation.y=t*0.5;demoPlane.rotation.z=Math.sin(t*0.7)*0.3;demoPlane.position.y=80+Math.sin(t*0.8)*10;camera.position.x=Math.sin(t*0.1)*30;camera.lookAt(demoPlane.position);renderer.render(scene,camera);}
        animate();
        window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
    </script>
</body>
</html>
