<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyDash — Carreira</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--gold:#FFD700;--accent:#00d4ff;--bg:#080f1e;--panel:rgba(10,20,40,0.85);--green:#44ff88;--red:#ff4444;}
        body{overflow-x:hidden;background:var(--bg);font-family:'Exo 2',sans-serif;color:#e0f0ff;min-height:100vh;}
        /* Stars bg */
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 20% 50%,rgba(0,50,100,0.3),transparent 70%),radial-gradient(ellipse at 80% 50%,rgba(50,0,100,0.2),transparent 70%);z-index:0;pointer-events:none;}
        #topbar{position:sticky;top:0;z-index:20;background:rgba(5,12,25,0.95);border-bottom:1px solid rgba(0,212,255,0.15);backdrop-filter:blur(10px);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;}
        .tb-left{display:flex;align-items:center;gap:16px;}
        .tb-title{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;color:var(--accent);letter-spacing:4px;}
        .tb-title span{color:var(--gold);}
        #coins-display{display:flex;align-items:center;gap:8px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);border-radius:24px;padding:7px 16px;}
        .ci{width:18px;height:18px;background:radial-gradient(circle at 35% 35%,#FFE87C,#FFD700,#B8860B);border-radius:50%;}
        #tb-coins{font-family:'Orbitron',monospace;font-size:16px;color:var(--gold);font-weight:700;}
        #btn-back{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#e0f0ff;padding:9px 18px;border-radius:6px;cursor:pointer;transition:all 0.2s;}
        #btn-back:hover{background:rgba(255,255,255,0.1);}

        /* Progress header */
        #progress-header{position:relative;z-index:1;padding:30px 24px 20px;text-align:center;}
        #progress-title{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;color:#fff;letter-spacing:4px;margin-bottom:8px;}
        #progress-title span{color:var(--gold);}
        #progress-subtitle{font-size:13px;color:rgba(255,255,255,0.4);letter-spacing:2px;margin-bottom:20px;}
        #overall-bar-wrap{max-width:600px;margin:0 auto;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;}
        #overall-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ff9900);border-radius:4px;transition:width 0.5s;}
        #overall-txt{font-family:'Orbitron',monospace;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:2px;margin-top:8px;}

        /* Filter tabs */
        #filter-tabs{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;padding:0 24px 20px;flex-wrap:wrap;}
        .filter-btn{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;padding:8px 16px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);border-radius:20px;cursor:pointer;transition:all 0.2s;}
        .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,0.08);}

        /* Mission grid */
        #missions-container{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:0 24px 40px;max-width:1400px;margin:0 auto;}
        .mission-card{background:var(--panel);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:18px;backdrop-filter:blur(8px);transition:all 0.25s;cursor:pointer;position:relative;overflow:hidden;}
        .mission-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:14px 14px 0 0;}
        .mission-card.type-collect_rings::before{background:linear-gradient(90deg,#FFD700,#ff9900);}
        .mission-card.type-survive_time::before{background:linear-gradient(90deg,#00d4ff,#0099cc);}
        .mission-card.type-fly_high::before{background:linear-gradient(90deg,#cc44ff,#8800cc);}
        .mission-card.type-fly_fast::before{background:linear-gradient(90deg,#ff4444,#cc0000);}
        .mission-card.type-fly_low::before{background:linear-gradient(90deg,#44ff88,#00cc44);}
        .mission-card.type-fly_distance::before{background:linear-gradient(90deg,#ff8800,#cc5500);}
        .mission-card:hover:not(.locked-card){transform:translateY(-3px);border-color:rgba(0,212,255,0.3);box-shadow:0 8px 25px rgba(0,0,0,0.3);}
        .mission-card.completed-card{border-color:rgba(68,255,136,0.25);background:rgba(68,255,136,0.04);}
        .mission-card.locked-card{opacity:0.45;cursor:not-allowed;}
        .mc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
        .mc-num{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.3);}
        .mc-badge{font-size:9px;letter-spacing:1px;font-family:'Orbitron',monospace;padding:3px 8px;border-radius:10px;}
        .mc-badge.done{background:rgba(68,255,136,0.15);color:var(--green);border:1px solid rgba(68,255,136,0.3);}
        .mc-badge.locked{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.1);}
        .mc-badge.available{background:rgba(0,212,255,0.1);color:var(--accent);border:1px solid rgba(0,212,255,0.3);}
        .mc-name{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;margin-bottom:6px;color:#fff;}
        .mc-desc{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:12px;line-height:1.5;}
        .mc-footer{display:flex;align-items:center;justify-content:space-between;}
        .mc-reward-lbl{font-size:13px;color:var(--gold);font-family:'Orbitron',monospace;font-weight:700;}
        .mc-type-icon{font-size:22px;}
        .mc-play-btn{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;padding:7px 14px;border:none;border-radius:6px;cursor:pointer;background:linear-gradient(135deg,var(--accent),#0099cc);color:#fff;font-weight:700;transition:all 0.2s;}
        .mc-play-btn:hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(0,212,255,0.4);}

        /* Chapter divider */
        .chapter-divider{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 0;}
        .cd-line{flex:1;height:1px;background:rgba(255,255,255,0.07);}
        .cd-label{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.3);}
    </style>
</head>
<body>
    <div id="topbar">
        <div class="tb-left">
            <div class="tb-title">SKY<span>DASH</span> — CARREIRA</div>
        </div>
        <div id="coins-display"><div class="ci"></div><span id="tb-coins">0</span></div>
        <button id="btn-back" onclick="location.href='jogo.html'">← VOLTAR</button>
    </div>

    <div id="progress-header">
        <div id="progress-title">MODO <span>CARREIRA</span></div>
        <div id="progress-subtitle">COMPLETE MISSÕES PARA GANHAR MOEDAS</div>
        <div id="overall-bar-wrap"><div id="overall-bar-fill" style="width:0%"></div></div>
        <div id="overall-txt">0 / 1000 MISSÕES</div>
    </div>

    <div id="filter-tabs">
        <button class="filter-btn active" onclick="filterMissions('all',this)">TODAS</button>
        <button class="filter-btn" onclick="filterMissions('available',this)">DISPONÍVEIS</button>
        <button class="filter-btn" onclick="filterMissions('completed',this)">COMPLETAS</button>
        <button class="filter-btn" onclick="filterMissions('collect_rings',this)">⭕ ANÉIS</button>
        <button class="filter-btn" onclick="filterMissions('survive_time',this)">⏱ TEMPO</button>
        <button class="filter-btn" onclick="filterMissions('fly_high',this)">📈 ALTITUDE</button>
        <button class="filter-btn" onclick="filterMissions('fly_fast',this)">⚡ VELOCIDADE</button>
        <button class="filter-btn" onclick="filterMissions('fly_low',this)">📉 RASANTE</button>
        <button class="filter-btn" onclick="filterMissions('fly_distance',this)">📏 DISTÂNCIA</button>
    </div>

    <div id="missions-container"></div>

    <script>
        const coins    = parseInt(localStorage.getItem('skydash_coins') || '0');
        const completed= JSON.parse(localStorage.getItem('skydash_completed') || '[]');
        document.getElementById('tb-coins').textContent = coins.toLocaleString('pt-BR');
        document.getElementById('overall-bar-fill').style.width = (completed.length/10)+'%';
        document.getElementById('overall-txt').textContent = completed.length+' / 1000 MISSÕES';

        const TYPE_ICONS = { collect_rings:'⭕', survive_time:'⏱', fly_high:'📈', fly_fast:'⚡', fly_low:'📉', fly_distance:'📏' };
        const TYPE_NAMES = { collect_rings:'Coleta de Anéis', survive_time:'Sobrevivência', fly_high:'Altitude', fly_fast:'Velocidade', fly_low:'Voo Rasante', fly_distance:'Distância' };

        function getMission(id) {
            const types = ['collect_rings','survive_time','fly_high','fly_fast','fly_low','fly_distance'];
            const seed = id * 1337 + 42;
            const rng  = (n) => { const x=Math.sin(seed*n+n)*43758.5453123; return x-Math.floor(x); };
            const type = types[Math.floor(rng(1)*types.length)];
            const tier = Math.floor(id/100);
            const diff = 1 + tier * 0.8;
            const defs = {
                collect_rings:  { target:Math.floor(3+diff*2),  desc:`Pegar ${Math.floor(3+diff*2)} anéis em um único voo`,      reward:Math.floor(1000+tier*500)  },
                survive_time:   { target:Math.floor(30+diff*20),desc:`Sobreviver por ${Math.floor(30+diff*20)} segundos`,          reward:Math.floor(800+tier*400)   },
                fly_high:       { target:Math.floor(80+diff*30),desc:`Alcançar altitude de ${Math.floor(80+diff*30)}m`,            reward:Math.floor(900+tier*450)   },
                fly_fast:       { target:Math.floor(100+diff*20),desc:`Atingir ${Math.floor(100+diff*20)} km/h`,                   reward:Math.floor(700+tier*350)   },
                fly_low:        { target:5,                      desc:`Voar abaixo de 15m por 5 segundos seguidos`,                reward:Math.floor(1200+tier*600)  },
                fly_distance:   { target:Math.floor(500+diff*300),desc:`Percorrer ${Math.floor(500+diff*300)}m de distância`,      reward:Math.floor(1100+tier*550)  },
            };
            return { id, type, name:`Missão #${id+1}`, ...defs[type] };
        }

        let currentFilter = 'all';
        let allMissions = [];

        function buildMissions() {
            allMissions = [];
            for (let i = 0; i < 1000; i++) allMissions.push(getMission(i));
        }

        function isLocked(id) {
            // First mission always unlocked; others require previous to be done
            if (id === 0) return false;
            // Every 10th mission requires previous chapter done
            if (id % 10 === 0) return !completed.includes(id-1);
            return false; // Most missions are freely available
        }

        function filterMissions(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            renderMissions();
        }

        function renderMissions() {
            const container = document.getElementById('missions-container');
            container.innerHTML = '';
            let displayed = 0;
            let lastChapter = -1;

            for (let i = 0; i < 1000; i++) {
                const m = allMissions[i];
                const isDone   = completed.includes(m.id);
                const locked   = isLocked(m.id);
                const chapter  = Math.floor(m.id / 100);

                // Filter
                if (currentFilter === 'available' && (isDone || locked)) continue;
                if (currentFilter === 'completed' && !isDone) continue;
                if (!['all','available','completed'].includes(currentFilter) && m.type !== currentFilter) continue;

                // Chapter divider
                if (chapter !== lastChapter && currentFilter === 'all') {
                    lastChapter = chapter;
                    const div = document.createElement('div');
                    div.className = 'chapter-divider';
                    div.innerHTML = `<div class="cd-line"></div><div class="cd-label">CAPÍTULO ${chapter+1} — TIER ${chapter+1}</div><div class="cd-line"></div>`;
                    container.appendChild(div);
                }

                const card = document.createElement('div');
                card.className = `mission-card type-${m.type}${isDone?' completed-card':''}${locked?' locked-card':''}`;
                const badgeClass = isDone ? 'done' : (locked ? 'locked' : 'available');
                const badgeText  = isDone ? '✓ COMPLETA' : (locked ? '🔒 BLOQUEADA' : '● DISPONÍVEL');
                card.innerHTML = `
                    <div class="mc-header">
                        <div class="mc-num">#${String(m.id+1).padStart(4,'0')}</div>
                        <div class="mc-badge ${badgeClass}">${badgeText}</div>
                    </div>
                    <div class="mc-name">${m.name}</div>
                    <div class="mc-desc">${TYPE_ICONS[m.type]} ${m.desc}</div>
                    <div class="mc-footer">
                        <div class="mc-reward-lbl">✦ ${m.reward.toLocaleString('pt-BR')}</div>
                        ${!isDone && !locked ? `<button class="mc-play-btn" onclick="event.stopPropagation();startMission(${m.id})">▶ JOGAR</button>` : `<span class="mc-type-icon">${isDone?'✅':TYPE_ICONS[m.type]}</span>`}
                    </div>
                `;
                container.appendChild(card);
                displayed++;
                if (displayed >= 200) break; // Performance: show max 200 at a time
            }

            if (displayed === 0) {
                container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:rgba(255,255,255,0.3);font-family:Orbitron,monospace;letter-spacing:2px;">NENHUMA MISSÃO ENCONTRADA</div>';
            }
        }

        function startMission(id) {
            location.href = `game.html?mode=career&mission=${id}`;
        }

        buildMissions();
        renderMissions();
    </script>
</body>
</html>
