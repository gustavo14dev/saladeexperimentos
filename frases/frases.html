    <style>
        :root {
            --bg-dark: #050505;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(20, 20, 20, 0.4);
            --accent-glow: rgba(124, 58, 237, 0.5);
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Evita scroll na animação de fundo */
            color: white;
        }

        /* Fundo Animado (Aurora Boreal) */
        .ambient-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #4c1d95; /* Violeta escuro */
            animation-delay: 0s;
        }

        .orb-2 {
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: #be185d; /* Rosa escuro */
            animation-delay: -5s;
        }

        .orb-3 {
            top: 40%;
            left: 40%;
            width: 30vw;
            height: 30vw;
            background: #0f766e; /* Teal escuro */
            animation-delay: -10s;
            opacity: 0.4;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Efeito de Ruído (Noise Texture) para dar textura profissional */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* Cartão de Vidro (Glassmorphism) */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(124, 58, 237, 0.1);
        }

        /* Tipografia */
        .quote-text {
            font-family: 'Playfair Display', serif;
            line-height: 1.4;
        }

        .quote-icon {
            font-family: 'Playfair Display', serif;
            position: absolute;
            top: -20px;
            left: 20px;
            font-size: 8rem;
            color: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            line-height: 1;
        }

        /* Botões */
        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: white;
            color: black;
            border: 1px solid white;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Animação de Texto */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .loading-blur {
            filter: blur(10px);
            opacity: 0;
            transition: all 0.5s ease;
        }
    </style>
</head>

            { texto: "Navegar é preciso; viver não é preciso.", autor: "Fernando Pessoa" },
            { texto: "O poeta é um fingidor. Finge tão completamente que chega a fingir que é dor a dor que deveras sente.", autor: "Fernando Pessoa" },
            { texto: "Ame a vida que você vive. Viva a vida que você ama.", autor: "Bob Marley" },
            { texto: "A verdade é que todo mundo vai te machucar. Você só tem que encontrar aqueles pelos quais vale a pena sofrer.", autor: "Bob Marley" },
            { texto: "Melhor morrer lutando pela liberdade do que ser um prisioneiro todos os dias da sua vida.", autor: "Bob Marley" },
            { texto: "O dinheiro não pode comprar a vida.", autor: "Bob Marley" },
            { texto: "A música é a linguagem universal da humanidade.", autor: "Henry Wadsworth Longfellow" },
            { texto: "Sem música, a vida seria um erro.", autor: "Friedrich Nietzsche" },
            { texto: "A inspiração existe, mas ela precisa te encontrar trabalhando.", autor: "Pablo Picasso" },
            { texto: "A criatividade é permitir a si mesmo cometer erros. A arte é saber quais erros manter.", autor: "Scott Adams" },

            { texto: "Quem pouco pensa, muito erra.", autor: "Leonardo da Vinci" },
            { texto: "O tempo dura bastante para aqueles que sabem aproveitá-lo.", autor: "Leonardo da Vinci" }
        ];

        const quoteText = document.getElementById('quote-text');
        const quoteAuthor = document.getElementById('quote-author');
        const container = document.getElementById('quote-container');

        function novaFrase() {
            // Animação de saída
            quoteText.classList.remove('fade-in');
            quoteAuthor.classList.remove('fade-in');
            
            quoteText.style.opacity = '0';
            quoteText.style.filter = 'blur(10px)';
            quoteText.style.transform = 'translateY(-10px)';
            
            quoteAuthor.style.opacity = '0';
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * frases.length);
                const frase = frases[randomIndex];
                
                quoteText.textContent = `"${frase.texto}"`;
                quoteAuthor.textContent = frase.autor;
                
                // Reset estilos para animação de entrada
                quoteText.style.transition = 'all 0.5s ease';
                quoteAuthor.style.transition = 'all 0.5s ease 0.1s';
                
                requestAnimationFrame(() => {
                    quoteText.style.opacity = '1';
                    quoteText.style.filter = 'blur(0)';
                    quoteText.style.transform = 'translateY(0)';
                    
                    quoteAuthor.style.opacity = '1';
                });
            }, 300);
        }

        function copiarFrase() {
            const texto = `${quoteText.textContent} — ${quoteAuthor.textContent}`;
            navigator.clipboard.writeText(texto).then(() => {
                mostrarToast();
            });
        }

        function compartilharWhatsApp() {
            const texto = `${quoteText.textContent} — ${quoteAuthor.textContent}`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        function compartilharTwitter() {
            const texto = `${quoteText.textContent} — ${quoteAuthor.textContent}`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        function mostrarToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
